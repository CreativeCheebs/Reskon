name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            mobile/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: mobile
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
          cd mobile
          go vet ./...
          go test ./...
      - name: Race tests
        run: |
          go test -race ./...
          cd mobile
          go test -race ./...
      - name: Vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          cd mobile
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Verify no-cgo release build
        run: CGO_ENABLED=0 go build -trimpath -o jitterbug ./cmd/jitterbug

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          path: .
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked packages
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint (including accessibility rules)
        run: npm run lint
      - name: Component tests
        run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production frontend build
        run: npm run build

  android:
    name: Android and Go AAR build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            mobile/go.sum
      - uses: android-actions/setup-android@v4
      - name: Install Android platform and NDK
        shell: pwsh
        run: sdkmanager "platforms;android-37" "ndk;27.2.12479018"
      - name: Install pinned gomobile tools
        shell: pwsh
        run: |
          $mobileVersion = 'v0.0.0-20261011034528-197770444867'
          go install "golang.org/x/mobile/cmd/gomobile@$mobileVersion"
          go install "golang.org/x/mobile/cmd/gobind@$mobileVersion"
          gomobile init
      - name: Build shared Go core AAR
        shell: pwsh
        run: ./mobile/build.ps1
      - name: Android lint, unit tests, and APK build
        shell: pwsh
        working-directory: mobile/android
        run: ./gradlew.bat :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      # Instrumented tests (:app:connectedDebugAndroidTest) need an emulator;
      # they are compiled here and run on a device by hand.
      - name: Check 16 KB page alignment (native library and APK)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $ndk = Get-ChildItem "$env:ANDROID_HOME/ndk" | Sort-Object Name | Select-Object -Last 1
          $readelf = Join-Path $ndk.FullName 'toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-readelf.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'aar'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path mobile/build/jbcore.aar).Path, $dir)
          foreach ($so in Get-ChildItem $dir -Recurse -Filter *.so) {
            foreach ($line in (& $readelf -lW $so.FullName | Select-String '\sLOAD\s')) {
              $align = [Convert]::ToInt64(($line.ToString().Trim() -split '\s+')[-1], 16)
              if ($align % 16384 -ne 0) { throw "$($so.Name) segment is aligned to $align, not 16 KB: $line" }
            }
          }
          $zipalign = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Recurse -Filter zipalign.exe | Sort-Object FullName | Select-Object -Last 1
          & $zipalign.FullName -c -P 16 -v 4 mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if ($LASTEXITCODE -ne 0) { throw 'APK is not 16 KB aligned' }

  container:
    name: Docker build and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t jitterbug:ci .
      - name: Smoke test - start on an empty data folder, then again on the same folder
        run: |
          set -e
          docker volume create jb-smoke
          for round in empty existing; do
            docker run -d --name jb-smoke-$round -p 18080:8080 -v jb-smoke:/data jitterbug:ci
            for i in $(seq 1 20); do curl -fsS http://localhost:18080/api/health && break; sleep 1; done
            curl -fsS http://localhost:18080/api/health
            curl -fsS http://localhost:18080/api/auth/status
            docker logs jb-smoke-$round
            docker rm -f jb-smoke-$round
          done
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jitterbug:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  repo-scan:
    name: Dependency files and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan go.sum, package-lock.json and Gradle files
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Software bill of materials
        uses: anchore/sbom-action@v0

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
